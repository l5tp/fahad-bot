# render.yaml
services:
  - type: web
    name: api-server
    runtime: node
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: my-postgres-db # تأكد من مطابقة اسم قاعدة البيانات التي ستنشئها في Render
          property: connectionString
      - key: PORT
        value: "5000"

# إذا كنت تريد تشغيل الـ Discord Bot كخدمة منفصلة:
  - type: worker
    name: discord-bot
    runtime: node
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter @workspace/discord-bot start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: my-postgres-db
          property: connectionString

databases:
  - name: my-postgres-db
    databaseName: mydb
    user: dbuser
    plan: free # يمكنك تغييره حسب احتياجك
